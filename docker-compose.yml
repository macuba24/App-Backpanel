services:
  postgres:
    image: postgres:16
    container_name: backpanel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backpanel
    ports:
      - "5432:5432"
    volumes:
      - backpanel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backpanel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backpanel_pg:
